# Reverse proxy: api subdomain -> API; web subdomains are served by their
# own hosts (Vercel/railway/etc). TLS terminates here. DB is NOT exposed.
server {
  listen 80;
  server_name api.depuko.example;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name api.depuko.example;
  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  client_max_body_size 30m;   # file uploads (25MB limit + overhead)
  location / {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}