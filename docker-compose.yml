# Local development infrastructure only. Not for production use (see docs/architecture §59-60).
version: "3.9"
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: depuko
      POSTGRES_PASSWORD: depuko
      POSTGRES_DB: depuko
    ports:
      - "5432:5432"
    volumes:
      - depuko_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: depuko
      MINIO_ROOT_PASSWORD: depuko123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - depuko_minio:/data

volumes:
  depuko_postgres:
  depuko_minio:
