name: DEPUKO CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - release/navy-refresh-main-sync
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: depuko-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Install, typecheck, build and API unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: TypeScript checks
        run: pnpm typecheck

      - name: Build workspace applications
        run: pnpm build

      - name: API unit tests
        run: pnpm --filter @depuko/api test -- --runInBand --testPathIgnorePatterns=http-e2e
